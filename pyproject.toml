[project]
name = "py-flight-duty-period"
version = "0.1.1"
description = "Calculates flight crew duty and rest limits per EASA CS-FTL.1.1 with no dependencies."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
